<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;font-family:"Source Sans Pro",system-ui,sans-serif;background:transparent}
.wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:12px;text-align:center}
table.t th,table.t td{border:1px solid #000;padding:3px 1px;white-space:nowrap;height:30px;color:#000;background:#fff}
table.t td.n,table.t th.n{text-align:left;padding-left:4px}
table.t th.we{background:#ffff00;color:#e00000}
table.t td.lb{background:#f4c2dd}
table.t td.ab{background:#ffff00}
.v{display:inline-block;border:2px solid #000;border-radius:6px;padding:1px 3px;font-weight:600;background:#fff}
.v.kd{background:#ffff00;min-width:20px;font-size:14px;font-weight:800}
.m{color:#e00000}
.k{cursor:pointer}.k:hover{outline:2px solid #1ba1e2;outline-offset:1px;background:#e8f6fd}
</style></head>
<body><div id="stage"><div class="wrap" id="w"></div></div>
<script>
function post(t,d){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:t},d),"*");}
function tinggi(){post("streamlit:setFrameHeight",{height:Math.ceil(document.getElementById("stage").getBoundingClientRect().height)+6});}
var terakhir=null;
window.addEventListener("message",function(e){
  if(!e.data||e.data.type!=="streamlit:render")return;
  var a=e.data.args||{};
  if(a.html===terakhir)return;
  terakhir=a.html;
  var w=document.getElementById("w");w.innerHTML=a.html;
  w.querySelectorAll(".k").forEach(function(el){
    el.onclick=function(){post("streamlit:setComponentValue",{value:{k:el.dataset.k,p:el.dataset.p,d:el.dataset.d||"",n:Date.now()},dataType:"json"});};
  });
  tinggi();
});
post("streamlit:componentReady",{apiVersion:1});
window.addEventListener("resize",tinggi);
</script></body></html>
