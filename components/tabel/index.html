<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;font-family:"Source Sans Pro",system-ui,sans-serif;background:transparent}
.bar{display:flex;justify-content:flex-end;margin:0 0 6px 0}
.bar button{font:600 13px "Source Sans Pro",system-ui,sans-serif;border:2px solid #000;border-radius:8px;background:#fff;padding:5px 14px;cursor:pointer}
.bar button:hover{background:#ffff00}
.wrap{overflow:auto;max-height:560px;border:1px solid #000;background:#fff}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;text-align:center}
table.t th,table.t td{border-right:1px solid #000;border-bottom:1px solid #000;padding:3px 1px;white-space:nowrap;height:30px;color:#000;background:#fff;box-sizing:border-box}
table.t th{position:sticky;top:0;z-index:3;background:#fff}
table.t td.n,table.t th.n{text-align:left;padding-left:4px;position:sticky;left:0;min-width:210px;max-width:210px;overflow:hidden;z-index:2}
table.t td.p,table.t th.p{position:sticky;left:210px;min-width:46px;z-index:2}
table.t th.n,table.t th.p{z-index:5}
table.t th.we{background:#ffff00;color:#e00000}
table.t td.lb{background:#f4c2dd}
table.t td.ab{background:#ffff00}
.v{display:inline-block;border:2px solid #000;border-radius:6px;padding:1px 3px;font-weight:600;background:#fff}
.v.kd{background:#ffff00;min-width:20px;font-size:14px;font-weight:800}
.m{color:#e00000}
.kos{display:block;width:100%;height:22px;border-radius:6px}
.v.kg{box-sizing:border-box;position:relative;background:#fff;width:22px;height:22px;padding:0;vertical-align:middle}
.v.kg:after{content:'';position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#1a73e8}
.v.kg.ada:after{width:14px;height:14px;margin:-7px 0 0 -7px}
.k{cursor:pointer}.k:hover{outline:2px solid #1ba1e2;outline-offset:1px;background:#e8f6fd}

/* ---- smartphone: tabel ringkas + kalender per orang ---- */
#kal{display:none;background:#fff}
.adm{display:flex;align-items:center;gap:8px;margin:0 0 8px 0}
.adm .tag{background:#ffff00;border:2px solid #000;border-radius:6px;font:800 12px system-ui,sans-serif;padding:3px 7px;white-space:nowrap}
.adm select{flex:1;min-width:0;font:600 14px system-ui,sans-serif;padding:6px;border:2px solid #000;border-radius:8px;background:#fff}
.nm{font:800 18px "Source Sans Pro",system-ui,sans-serif;text-align:center;color:#000;margin:2px 0}
.rt{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 0 8px 0}
.rt .k{display:inline-flex;align-items:center;gap:8px;font:700 20px "Source Sans Pro",system-ui,sans-serif;color:#000;padding:2px 6px;border-radius:6px}
.rt .k.m{color:#e00000}
.rt svg{width:26px;height:26px;stroke:#1a73e8;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hd,.gr{display:grid;grid-template-columns:repeat(7,1fr)}
.hd span{text-align:center;font:700 11px system-ui,sans-serif;color:#000;padding:3px 0}
.hd span.we{color:#e00000}
.c{position:relative;height:52px;border:1px solid #d0d0d0;margin:0 -1px -1px 0;background:#fff;box-sizing:border-box}
.c.off{border-color:transparent;background:transparent}
.c.lb{background:#f4c2dd}.c.ab{background:#ffff00}
.c .dt{position:absolute;left:3px;top:1px;font:600 9px system-ui,sans-serif;color:#333;font-style:normal}
.c .b{position:absolute;left:3px;right:3px;top:12px;bottom:3px;display:flex;align-items:center;justify-content:center;
  box-sizing:border-box;border:2px solid #000;border-radius:6px;background:#fff;font:800 14px "Source Sans Pro",system-ui,sans-serif;color:#000;padding:0}
.c .b.m{color:#e00000}.c .b.y{background:#ffff00;font-size:15px}
.c .b.kg{width:auto;height:auto;position:absolute}
.c .b.kg:after{content:'';width:8px;height:8px;border-radius:50%;background:#1a73e8;position:static;margin:0}
.c .b.kg.ada:after{width:14px;height:14px}
.c .b.kg:after{display:block}
@media (max-width:640px){
  .bar{margin:0 0 4px 0}.bar button{font-size:12px;padding:4px 10px}
  table.t{font-size:10px}
  table.t td.n,table.t th.n{min-width:92px;max-width:92px;padding-left:2px;font-size:10px;white-space:normal;line-height:1.05}
  table.t th,table.t td{height:26px;padding:2px 0}
  .v{padding:0 2px;border-width:1.5px;border-radius:4px;font-size:10px}
  .v.kd{font-size:11px;min-width:14px}
  .v.kg{width:17px;height:17px}
  .v.kg:after{width:7px;height:7px;margin:-3.5px 0 0 -3.5px}.v.kg.ada:after{width:10px;height:10px;margin:-5px 0 0 -5px}
}
</style></head>
<body><div id="stage"><div id="kal"></div><div class="bar"><button id="unduh">⬇ UNDUH GAMBAR</button></div><div class="wrap" id="w"></div></div>
<script>
function post(t,d){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:t},d),"*");}
var namaFile="monitoring.png";
function tinggi(){
  var mx=560;try{mx=Math.max(320,window.parent.innerHeight-95);}catch(e){}
  document.getElementById("w").style.maxHeight=mx+"px";
  post("streamlit:setFrameHeight",{height:Math.ceil(document.getElementById("stage").getBoundingClientRect().height)+6});
}
// gambar tabel lengkap (tanpa terpotong scroll) digambar sendiri di canvas, tanpa pustaka luar
function unduh(){
  var w=document.getElementById("w"),t=w.querySelector("table");if(!t)return;
  var kl=document.createElement("div");kl.style.cssText="position:absolute;left:-99999px;top:0;background:#fff";
  var tk=t.cloneNode(true);tk.querySelectorAll("th,td").forEach(function(e){e.style.position="static";e.style.maxWidth="none";});
  tk.style.width="auto";kl.appendChild(tk);document.body.appendChild(kl);
  var tr=tk.getBoundingClientRect(),S=2,cv=document.createElement("canvas");
  cv.width=Math.ceil(tr.width*S)+2;cv.height=Math.ceil(tr.height*S)+2;
  var g=cv.getContext("2d");g.scale(S,S);g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);
  function rr(x,y,w2,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w2,y,x+w2,y+h,r);g.arcTo(x+w2,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w2,y,r);g.closePath();}
  tk.querySelectorAll("th,td").forEach(function(e){
    var r=e.getBoundingClientRect(),x=r.left-tr.left,y=r.top-tr.top,cs=getComputedStyle(e);
    g.fillStyle=cs.backgroundColor;g.fillRect(x,y,r.width,r.height);
    g.strokeStyle="#000";g.lineWidth=1;g.strokeRect(x+.5,y+.5,r.width-1,r.height-1);
    var v=e.querySelector(".v");if(v&&v.classList.contains("kg")){var cx=x+r.width/2,cy=y+r.height/2;g.fillStyle="#fff";g.lineWidth=2;g.strokeStyle="#000";rr(cx-11,cy-11,22,22,5);g.fill();g.stroke();g.fillStyle="#1a73e8";g.beginPath();g.arc(cx,cy,v.classList.contains("ada")?7:5,0,7);g.fill();return;}var teks=(v||e).textContent.trim();if(!teks)return;
    var f=getComputedStyle(v||e);g.font=(f.fontWeight>=600?"bold ":"")+f.fontSize+" Arial, sans-serif";
    g.textBaseline="middle";var lebar=g.measureText(teks).width;
    var kiri=e.classList.contains("n"),tx=kiri?x+5:x+(r.width-lebar)/2,ty=y+r.height/2+1;
    if(v){var bw=lebar+10,bh=22,bx=x+(r.width-bw)/2,by=y+(r.height-bh)/2;
      g.fillStyle=getComputedStyle(v).backgroundColor;rr(bx,by,bw,bh,5);g.fill();g.lineWidth=2;g.strokeStyle="#000";g.stroke();}
    g.fillStyle=f.color;g.fillText(teks,tx,ty);
  });
  document.body.removeChild(kl);
  cv.toBlob(function(b){var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=namaFile;
    document.body.appendChild(a);a.click();document.body.removeChild(a);},"image/png");
}
document.getElementById("unduh").onclick=unduh;

var D={kal:[],mode:""},pilih=-1,IKON='<svg viewBox="0 0 24 24"><polyline points="3,17 9,11 13,15 21,6"/><polyline points="15,6 21,6 21,12"/></svg>';
function pasangKlik(root){
  root.querySelectorAll(".k").forEach(function(el){
    el.onclick=function(){post("streamlit:setComponentValue",{value:{k:el.dataset.k,p:el.dataset.p,d:el.dataset.d||"",n:Date.now()},dataType:"json"});};
  });
}
function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML;}
function kalender(){
  var k=document.getElementById("kal");
  if(!D.kal.length){k.innerHTML="";return;}
  var adm=D.mode==="admin";
  if(pilih>=D.kal.length||(pilih<0&&!adm))pilih=adm?-1:0;
  var x=D.kal[pilih],h="";
  if(adm){h+='<div class="adm"><span class="tag">&#128276; MODE ADMIN</span><select id="pil"><option value="-1"'+(pilih<0?" selected":"")+">Semua karyawan</option>";
    D.kal.forEach(function(o,i){h+='<option value="'+i+'"'+(i===pilih?" selected":"")+">"+esc(o.nama)+"</option>";});h+="</select></div>";}
  if(pilih<0){k.innerHTML=h;var p0=document.getElementById("pil");p0.onchange=function(){pilih=+p0.value;tampil();tinggi();};return;}
  h+='<div class="nm">'+esc(x.nama)+"</div>";
  if(x.rata)h+='<div class="rt"><span class="k'+(x.rm?" m":"")+'" data-k="r" data-p="'+x.i+'">'+esc(x.rata)+IKON+"</span></div>";
  h+='<div class="hd">'+["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(function(n,i){return '<span class="'+(i>4?"we":"")+'">'+n+"</span>";}).join("")+"</div>";
  h+='<div class="gr">'+x.cells+"</div>";
  k.innerHTML=h;pasangKlik(k);
  var p=document.getElementById("pil");if(p)p.onchange=function(){pilih=+p.value;tampil();tinggi();};
}
function tampil(){
  var hp=window.innerWidth<=640&&D.kal.length>0;
  document.getElementById("kal").style.display=hp?"block":"none";
  if(hp&&D.mode==="admin"&&pilih===undefined)pilih=-1;
  if(hp)kalender();
  var semua=!hp||pilih<0;
  document.getElementById("w").style.display=semua?"block":"none";
  document.querySelector(".bar").style.display=semua?"flex":"none";
}
var terakhir=null;
window.addEventListener("message",function(e){
  if(!e.data||e.data.type!=="streamlit:render")return;
  var a=e.data.args||{};
  if(a.nama_file)namaFile=a.nama_file;
  var tanda=a.html+JSON.stringify(a.kal||[])+(a.mode||"");
  if(tanda===terakhir)return;
  terakhir=tanda;
  D={kal:a.kal||[],mode:a.mode||""};
  var w=document.getElementById("w");w.innerHTML=a.html;
  pasangKlik(w);
  tampil();tinggi();
});
post("streamlit:componentReady",{apiVersion:1});
window.addEventListener("resize",function(){tampil();tinggi();});
</script></body></html>
